# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# `contents: read` only. The `id-token: write` that used to sit here had no
# consumer — nothing in this workflow does OIDC to a cloud provider (no
# aws-actions/*, no google-github-actions/*), so it was handing every step a
# token it could mint cloud credentials with, for nothing.
permissions:
  contents: read

jobs:
  lint-then-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # persist-credentials: false — checkout writes a token into .git/config by
        # default and nothing here pushes, tags or opens a PR, so the credential is
        # only an extra thing for a step (or a dependency this workflow runs) to find.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        # v4 runs on the node16 action runtime, which GitHub has removed — actionlint
        # reports it as "too old to run on GitHub Actions". Same inputs on v5
        # (go-version-file + cache), so this is a runtime bump only.
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.11.3
          args: --timeout=5m

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -p=1 -count=1 -failfast -coverprofile=coverage.txt -coverpkg=./... ./...

      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}